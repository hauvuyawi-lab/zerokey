name: Harvest DuckAI Token

on:
  schedule:
    # Run every 2 hours to keep Cloudflare KV VQD token continuously fresh
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  harvest:
    name: Harvest VQD Token
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Harvest token and update Cloudflare KV
        env:
          WORKER_URL: ${{ vars.WORKER_URL || secrets.WORKER_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node scripts/harvest.js
